name: Deploy docs to GitHub Pages

# Three triggers, by intent:
#   1. push to main with docs/mkdocs changes → auto-deploy. Filtered by `paths:`
#      so unrelated commits don't churn through a Pages deploy.
#   2. workflow_dispatch → manual "Run workflow" button in the Actions UI.
#   3. workflow_run after the package release workflow succeeds → docs deploy
#      pairs with each release tag so the published site matches the version.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/docs.yml'
      - 'README.md'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you publishing docs? (free text, appears in run summary)'
        required: false
        type: string
        default: 'manual dispatch'
  workflow_run:
    workflows: ['Package Sauti UPM release']
    types: [completed]
    branches: [main]

# Single concurrent deployment; do not cancel in-flight deploys.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build MkDocs site
    runs-on: ubuntu-latest
    # `workflow_run` fires on EVERY completion (success/failure); gate on
    # success so a failed package release doesn't deploy stale docs. `push`
    # and `workflow_dispatch` always proceed.
    if: >-
      ${{ github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # workflow_run runs against the default branch SHA by default; check
          # out the SHA the triggering workflow ran against so the docs match
          # the released package exactly.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Run summary
        env:
          # Commit messages are user-controlled and can contain shell metachars
          # (`;`, `$()`, backticks) — pass via env var to neutralise injection.
          # actionlint flags this specifically (good — listen to it).
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          {
            echo "### Docs deploy trigger"
            echo ""
            echo "- Event: \`${{ github.event_name }}\`"
            case "${{ github.event_name }}" in
              workflow_dispatch)
                echo "- Reason: ${{ inputs.reason }}"
                ;;
              workflow_run)
                echo "- Triggered by: \`${{ github.event.workflow_run.name }}\` run #${{ github.event.workflow_run.run_number }}"
                echo "- SHA: \`${{ github.event.workflow_run.head_sha }}\`"
                ;;
              push)
                echo "- Pushed by: \`${{ github.actor }}\`"
                echo "- SHA: \`${{ github.sha }}\`"
                echo "- Commit: ${COMMIT_MESSAGE%%$'\n'*}"
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          # actions/setup-python@v5's pip cache defaults to scanning for
          # requirements.txt / pyproject.toml. We install from
          # requirements-docs.txt instead, so point the cache at it explicitly.
          # Without this, the job fails with:
          #   "No file in <repo> matched to [**/requirements.txt or **/pyproject.toml]"
          cache-dependency-path: requirements-docs.txt

      - name: Install MkDocs + plugins
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docs.txt

      - name: Build site (strict mode — fails on broken links)
        run: mkdocs build --strict --verbose

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
